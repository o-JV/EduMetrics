<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduMetrics — Atividade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">Edu<span>Metrics</span></div>
    <nav>
      <a href="aluno.html" class="nav-item">← Voltar ao painel</a>
    </nav>
    <div class="who">
      <strong id="who-name">—</strong>
      <button class="logout" onclick="EDU_AUTH.sair()">Sair</button>
    </div>
  </aside>

  <main>
    <div id="area-quiz">
      <div class="panel">
        <div class="quiz-head">
          <div>
            <h1 id="q-titulo" style="font-size:20px;">Atividade</h1>
            <div class="quiz-progress" id="q-progresso"></div>
          </div>
          <div class="quiz-timer" id="q-timer">0:00</div>
        </div>
        <div class="quiz-bar-track"><div class="quiz-bar-fill" id="q-barra" style="width:0%"></div></div>

        <p class="quiz-question" id="q-enunciado"></p>
        <div class="quiz-options" id="q-opcoes"></div>

        <div class="quiz-actions">
          <button id="q-avancar" disabled>Próxima questão</button>
        </div>
      </div>
    </div>

    <div id="area-resumo" class="panel" style="display:none;">
      <h2>Atividade concluída</h2>
      <p class="panel-sub" id="resumo-sub"></p>
      <div class="indicators">
        <div class="indicator">
          <div class="label">Acertos</div>
          <div class="value num-display" id="resumo-acertos"></div>
        </div>
        <div class="indicator">
          <div class="label">Tempo total</div>
          <div class="value num-display" id="resumo-tempo"></div>
        </div>
      </div>
      <p class="panel-sub">Seu professor já recebeu o resultado, incluindo as questões em que você mais demorou.</p>
      <button class="enter-btn" style="max-width:220px;" onclick="window.location.href='aluno.html'">Voltar ao painel</button>
    </div>
  </main>
</div>

<script src="../assets/supabase.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/activities.js"></script>
<script src="../assets/auth.js"></script>
<script>
  (async () => {
    await EDU.carregarTudo();
    const s = document.createElement("script");
    s.src = "../assets/atividade.js";
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
